<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🌉</span>
        <h1>Context Bridge</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
        <div id="auth-status" class="auth-status">
          <button id="login-btn" class="btn btn-primary hidden">Login</button>
          <div id="user-info" class="user-info hidden">
            <img id="user-avatar" class="avatar" src="" alt="User">
            <span id="user-name"></span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Capture Panel -->
      <section id="capture-panel" class="panel">
        <h2>📥 Capture Context</h2>
        <p class="hint">Select text and press <kbd>Ctrl+Shift+S</kbd> to save</p>
        <button id="capture-btn" class="btn btn-secondary">
          Capture Full Conversation
        </button>
      </section>

      <!-- Memories List -->
      <section id="memories-panel" class="panel">
        <div class="panel-header">
          <h2>🧠 Memory Bank</h2>
          <button id="add-memory-btn" class="btn btn-icon" title="Add Memory">+</button>
        </div>
        <div id="memories-list" class="memories-list">
          <p class="empty-state">No memories yet. Capture your first context!</p>
        </div>
      </section>

      <!-- Memory Editor (hidden by default) -->
      <section id="memory-editor" class="panel hidden">
        <h2 id="editor-title">New Memory</h2>
        <form id="memory-form">
          <div class="form-group">
            <label for="memory-title">Title</label>
            <input type="text" id="memory-title" required>
          </div>
          <div class="form-group">
            <label for="memory-content">Content</label>
            <textarea id="memory-content" rows="6" required></textarea>
          </div>
          <div class="form-group">
            <label for="memory-tags">Tags (comma separated)</label>
            <input type="text" id="memory-tags" placeholder="code, react, tutorial">
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </section>

      <!-- Sync Status -->
      <section id="sync-panel" class="panel panel-small">
        <div class="sync-status">
          <span id="sync-indicator" class="sync-indicator"></span>
          <span id="sync-text">Synced</span>
        </div>
        <button id="sync-btn" class="btn btn-icon" title="Sync Now">🔄</button>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Context Bridge v1.0.0</span>
    </footer>
  </div>

  <script src="index.js" type="module"></script>
</body>

</html>
