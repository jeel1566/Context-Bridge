name: Deploy to Azure Functions

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'context-bridge-api'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend'
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Create and activate virtual environment
      run: |
        cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        python -m venv venv
        source venv/bin/activate

    - name: Install dependencies
      run: |
        cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        source venv/bin/activate
        pip install uv
        uv pip install -r requirements.txt

    - name: Run tests
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        source venv/bin/activate
        # Run tests if they exist
        if [ -d "tests" ] || ls test_*.py >/dev/null 2>&1; then
          pip install pytest
          python -m pytest -v
        else
          echo "No tests found, skipping tests"
        fi

    - name: Prepare deployment package
      run: |
        cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        # Create .funcignore if it doesn't exist
        if [ ! -f ".funcignore" ]; then
          echo "venv/" > .funcignore
          echo "__pycache__/" >> .funcignore
          echo "*.pyc" >> .funcignore
          echo ".git/" >> .funcignore
          echo ".vscode/" >> .funcignore
          echo "tests/" >> .funcignore
          echo ".env" >> .funcignore
          echo "local.settings.json" >> .funcignore
        fi

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        scm-do-build-during-deployment: true
        enable-oryx-build: true
